name: Monthly AI News Blog Post

on:
  schedule:
    # 07:00 UTC on the 1st of every month (10:00 Romania time) — covers the previous month.
    - cron: '0 7 1 * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate monthly post
        id: generate
        env:
          # OpenRouter is used when its key is set (free models first, then the
          # paid fallback); otherwise the Anthropic key is used.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-monthly-post.mjs
        continue-on-error: true

      - name: Commit and push new post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Emad Blog Bot"
          git config user.email "hamidleo1984@gmail.com"
          git add content/blog/
          if git diff --cached --quiet; then
            echo "No new post generated this month."
          else
            MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
            git commit -m "blog: monthly AI news roundup for $MONTH"
            git push origin main
          fi

      - name: Fail if generation was incomplete
        if: steps.generate.outcome == 'failure'
        run: |
          echo "ERROR: Blog post generation failed for one or more locales. Check logs above."
          exit 1
